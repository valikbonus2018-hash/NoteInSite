<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NoteInSite popup sandbox</title>
<link rel="stylesheet" href="../src/popup.css">
<style>
  body { background: #dfe3ea; }
  #log { position: fixed; right: 6px; top: 6px; width: 300px; max-height: 300px; overflow: auto;
         background:#111; color:#0f0; font:11px/1.3 monospace; padding:6px; white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="log"></pre>
<script>
const log = (...a) => { document.getElementById('log').textContent +=
  a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ') + '\n'; };
window.onerror = (m, s, l, c) => log('ERROR:', m, '@' + l + ':' + c);

const STORE = {
  'nis:page:http://localhost:8777/test/sandbox.html': [
    { id: 'a1', html: 'Заметка <b>раз</b>', bg: '#fff59d', x: 10, y: 10 },
    { id: 'a2', html: 'Вторая заметка со ссылкой', bg: '#b8f2c9', x: 40, y: 80, fixed: true }
  ],
  'nis:site:http://localhost:8777': [
    { id: 'b1', html: 'Общая для сайта', bg: '#cfe3ff', x: 20, y: 200 }
  ],
  // корзина: удалённые заметки живут три дня, отсюда их возвращают кнопкой ⟲
  'nis:trash': [
    { id: 'c1', at: Date.now() - 20 * 60 * 1000,
      key: 'nis:page:http://localhost:8777/test/sandbox.html', scope: 'page',
      host: 'localhost', text: 'Удалил по ошибке',
      note: { id: 'c1', html: 'Удалил по ошибке', bg: '#ffd9c9', x: 60, y: 140, updatedAt: Date.now() - 20 * 60 * 1000 } },
    { id: 'c2', at: Date.now() - 26 * 60 * 60 * 1000,
      key: 'nis:page:http://example.org/article', scope: 'page',
      host: 'example.org', text: 'Удалена вчера на другом сайте',
      note: { id: 'c2', html: 'Удалена вчера на другом сайте', bg: '#d9f2d9', x: 10, y: 10, updatedAt: Date.now() - 26 * 60 * 60 * 1000 } }
  ]
};
window.chrome = {
  storage: { local: {
    get(keys) {
      let out = {};
      if (keys == null) out = JSON.parse(JSON.stringify(STORE));
      else for (const k of [].concat(keys)) if (k in STORE) out[k] = JSON.parse(JSON.stringify(STORE[k]));
      return Promise.resolve(out);
    },
    set(o) { Object.assign(STORE, o); log('SET', Object.keys(o).join(',')); return Promise.resolve(); },
    remove(k) { for (const x of [].concat(k)) delete STORE[x]; log('DEL', String(k)); return Promise.resolve(); }
  } },
  tabs: {
    query: () => Promise.resolve([{ id: 1, url: 'http://localhost:8777/test/sandbox.html' }]),
    sendMessage(id, msg, cb) {
      log('MSG→tab', JSON.stringify(msg));
      if (msg.type === 'nis:list') {
        cb({ ok: true, visible: true, notes: [
          { id: 'a1', scope: 'page', fixed: false, bg: '#fff59d', text: 'Заметка раз' },
          { id: 'a2', scope: 'page', fixed: true, bg: '#b8f2c9', text: 'Вторая заметка со ссылкой' },
          { id: 'b1', scope: 'site', fixed: false, bg: '#cfe3ff', text: 'Общая для сайта' }
        ] });
      } else cb({ ok: true });
    }
  },
  runtime: { lastError: undefined }
};

fetch('../src/popup.html')
  .then(r => r.text())
  .then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const frag = document.createElement('div');
    frag.innerHTML = doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g, '');
    document.body.appendChild(frag);
    // порядок как в popup.html: сначала белый список, им импорт чистит HTML
    const load = src => new Promise(ok => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      document.body.appendChild(s);
    });
    load('../src/sanitize.js').then(() => load('../src/popup.js'));
  });
</script>
</body>
</html>
