<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NoteInSite popup sandbox</title>
<link rel="stylesheet" href="../src/popup.css">
<style>
  * { transition: none !important; animation: none !important; }   /* иначе в headless переключатели снимаются в промежуточном состоянии */
  html, body { height: 100%; }
  body {
    width: 100% !important; padding: 0 !important; margin: 0 !important;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    background: radial-gradient(circle at 30% 20%, #eef2fa, #d7deeb 70%);
  }
  #log { display: none; }
  #frame {
    width: 350px; padding: 10px; border-radius: 16px; background: #f4f6fa;
    box-shadow: 0 24px 60px rgba(25,32,50,.28), 0 0 0 1px rgba(0,0,0,.06);
  }
  #frame > div { padding: 0 !important; }
  .cap { text-align: center;
         font: 600 26px/1.3 system-ui, Arial, sans-serif; color: #2a3346; }
  .cap small { display: block; margin-top: 6px; font: 400 15px/1.4 system-ui, Arial, sans-serif; color: #5d6679; }

  /* ?bare=1 — только само окно расширения, без подписи и лишнего фона:
     кадр получается готовым к обрезке по краю (как shot-popup.png на сайте) */
  body.bare { display: block; padding: 2px; background: #dfe3ea; }
  body.bare .cap { display: none; }
  body.bare #frame { width: 370px; margin: 0; }
</style>
</head>
<body>
<div class="cap">Окно расширения<small>показ заметок, список на странице, настройки и резервная копия</small></div>
<div id="frame"></div>
<pre id="log"></pre>
<script>
if (new URLSearchParams(location.search).get('bare')) document.body.classList.add('bare');
const log = (...a) => { document.getElementById('log').textContent +=
  a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ') + '\n'; };
window.onerror = (m, s, l, c) => log('ERROR:', m, '@' + l + ':' + c);

const STORE = {
  'nis:page:http://localhost:8777/test/sandbox.html': [
    { id: 'a1', html: 'Заметка <b>раз</b>', bg: '#fff59d', x: 10, y: 10 },
    { id: 'a2', html: 'Вторая заметка со ссылкой', bg: '#b8f2c9', x: 40, y: 80, fixed: true }
  ],
  'nis:site:http://localhost:8777': [
    { id: 'b1', html: 'Общая для сайта', bg: '#cfe3ff', x: 20, y: 200 }
  ]
};
window.chrome = {
  storage: { local: {
    get(keys) {
      let out = {};
      if (keys == null) out = JSON.parse(JSON.stringify(STORE));
      else for (const k of [].concat(keys)) if (k in STORE) out[k] = JSON.parse(JSON.stringify(STORE[k]));
      return Promise.resolve(out);
    },
    set(o) { Object.assign(STORE, o); log('SET', Object.keys(o).join(',')); return Promise.resolve(); },
    remove(k) { for (const x of [].concat(k)) delete STORE[x]; log('DEL', String(k)); return Promise.resolve(); }
  } },
  tabs: {
    query: () => Promise.resolve([{ id: 1, url: 'http://localhost:8777/test/sandbox.html' }]),
    sendMessage(id, msg, cb) {
      log('MSG→tab', JSON.stringify(msg));
      if (msg.type === 'nis:list') {
        cb({ ok: true, visible: true, notes: [
          { id: 'a1', scope: 'page', fixed: false, bg: '#fff59d', text: 'Заметка раз' },
          { id: 'a2', scope: 'page', fixed: true, bg: '#b8f2c9', text: 'Вторая заметка со ссылкой' },
          { id: 'b1', scope: 'site', fixed: false, bg: '#cfe3ff', text: 'Общая для сайта' }
        ] });
      } else cb({ ok: true });
    }
  },
  runtime: { lastError: undefined }
};

fetch('../src/popup.html')
  .then(r => r.text())
  .then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const frag = document.createElement('div');
    frag.innerHTML = doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g, '');
    document.getElementById('frame').appendChild(frag);
    const s = document.createElement('script');
    s.src = '../src/popup.js';
    document.body.appendChild(s);
  });
</script>
</body>
</html>
