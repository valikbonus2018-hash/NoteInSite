<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — NoteInSite</title>
<meta name="robots" content="noindex">
<!-- Страница ошибки намеренно самодостаточна: она отдаётся по любому несуществующему
     адресу, поэтому не зависит от внешних файлов и относительных путей. -->
<style>
:root {
  --bg: #f4f6fb; --bg-soft: #fff; --ink: #1b1f2a; --ink-soft: #4b5468; --ink-mute: #737e93;
  --line: #dde2ee; --accent: #2f6bff; --accent-ink: #fff; --note: #fff3a8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101319; --bg-soft: #171b24; --ink: #e8ecf5; --ink-soft: #b3bbcd; --ink-mute: #8b93a6;
    --line: #2a3040; --accent: #6b95ff; --accent-ink: #0d1017; --note: #e8d77a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: var(--ink); padding: 32px 20px; text-align: center;
  font: 17px/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 560px; }
.note {
  display: inline-block; background: var(--note); color: #232733;
  padding: 14px 16px; border-radius: 6px; transform: rotate(-2deg);
  box-shadow: 0 6px 18px rgba(20, 28, 48, .18); margin-bottom: 30px; max-width: 300px;
}
h1 { font-size: clamp(1.8rem, 1.2rem + 2vw, 2.6rem); letter-spacing: -.015em; margin: 0 0 .4em; }
p.lead { color: var(--ink-soft); margin: 0 0 26px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
a.btn {
  display: inline-flex; align-items: center; padding: 12px 20px; border-radius: 12px;
  font-weight: 600; font-size: .98rem; text-decoration: none;
  background: var(--accent); color: var(--accent-ink); border: 1px solid transparent;
}
a.ghost { background: var(--bg-soft); color: var(--ink); border-color: var(--line); }
footer { margin-top: 34px; color: var(--ink-mute); font-size: .88rem; }
</style>
</head>
<body>

<div class="wrap">
  <div class="note">Кажется, эту страницу кто-то <b>переклеил</b></div>
  <h1>404 — страница не найдена</h1>
  <p class="lead">Адрес изменился или в нём опечатка. Вот куда можно пойти дальше:</p>
  <div class="actions">
    <a class="btn" href="/" data-to="index.html">На главную</a>
    <a class="btn ghost" href="/help.html" data-to="help.html">Справка</a>
    <a class="btn ghost" href="/support.html" data-to="support.html">Поддержка</a>
  </div>
  <footer>NoteInSite — заметки прямо в тексте любых сайтов</footer>
</div>

<script>
// Пока сайт лежит в подпапке (до привязки поддомена), корень «/» ведёт на другой сайт —
// поэтому ссылки достраиваются от той папки, из которой отдана эта страница.
(function () {
  var m = location.pathname.match(/^(\/[^\/]+\/)(?:.*)?$/);
  var base = (m && m[1] !== '/' && /noteinsite/i.test(m[1])) ? m[1] : '/';
  if (base === '/') return;
  Array.prototype.forEach.call(document.querySelectorAll('[data-to]'), function (a) {
    a.setAttribute('href', base + a.getAttribute('data-to'));
  });
})();
</script>
</body>
</html>
